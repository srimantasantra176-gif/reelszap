<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reelszap - Video Downloader</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #17132f, #7c3aed);
    color: white;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 48px;
    font-weight: bold;
}

.logo span {
    color: #a78bfa;
}

.subtitle {
    font-size: 20px;
    margin-top: 8px;
    color: #e5e7eb;
}

.card {
    background: white;
    color: #222;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.card h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 15px;
    font-size: 16px;
    outline: none;
    margin-bottom: 15px;
}

input:focus {
    border-color: #7c3aed;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 15px;
    background: #7c3aed;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.message {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #ddd;
    margin-top: 25px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">Reel<span>szap</span></div>
        <div class="subtitle">Simple Video Downloader</div>
    </div>

    <div class="card">
        <h2>Instagram</h2>
        <input id="instagram" type="url"
               placeholder="Paste Instagram video URL">
        <button onclick="downloadVideo('instagram')">
            Download
        </button>
        <div id="instagramMsg" class="message"></div>
    </div>

    <div class="card">
        <h2>Facebook</h2>
        <input id="facebook" type="url"
               placeholder="Paste Facebook video URL">
        <button onclick="downloadVideo('facebook')">
            Download
        </button>
        <div id="facebookMsg" class="message"></div>
    </div>

    <div class="card">
        <h2>YouTube</h2>
        <input id="youtube" type="url"
               placeholder="Paste YouTube video URL">
        <button onclick="downloadVideo('youtube')">
            Download
        </button>
        <div id="youtubeMsg" class="message"></div>
    </div>

    <div class="footer">
        Reelszap © 2026
    </div>

</div>

<script>
function downloadVideo(platform) {

    const input = document.getElementById(platform);
    const message = document.getElementById(platform + "Msg");

    const url = input.value.trim();

    if (url === "") {
        message.innerText = "Please paste a video URL first.";
        return;
    }

    try {
        new URL(url);
    } catch {
        message.innerText = "Please enter a valid URL.";
        return;
    }

    message.innerText =
        "URL received. A download service/API is required to download the video.";
}
</script>

</body>
</html>
